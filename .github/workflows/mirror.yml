name: mirror

# Twice a day: copy what Tickerz printed into prints/ and daily-proofs/. The run fails, and writes nothing, if a first print
# already in this repo changed or a period disappeared. See scripts/mirror.ts: Node 24 runs it as is, with no install.
on:
  schedule:
    - cron: "40 13 * * *"
    - cron: "40 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: a run started by hand while the scheduled one runs would race it to the same commit.
concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    # The only job, and it commits prints/ and daily-proofs/ to main.
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Mirror the prints
        run: node scripts/mirror.ts
      - name: Commit
        run: |
          git config user.name "tickerz"
          git config user.email "support@tickerz.com"
          git add prints daily-proofs
          git diff --cached --quiet && exit 0
          git commit -m "Prints through $(date -u +%F)"
          # The forecast can push at the same minute; take its commit first, as cosign.yml does.
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
