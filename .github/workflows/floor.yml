name: floor

# The Floor (floor/latest.json, the first version of the file behind tickerz.com/proof-of-work): every change is checked against floor/schema.json and the
# public rules in test/floor.test.ts before it lands. Public repo, so the minutes are free.
on:
  pull_request:
    paths:
      - "floor/**"
      - "test/floor.test.ts"
      - ".github/workflows/floor.yml"
  push:
    branches: [main]
    paths:
      - "floor/**"
      - "test/floor.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Check the Floor file
        run: node --import tsx test/floor.test.ts
