name: floor

# The Floor (floor/latest.json, the first version of the file behind tickerz.com/proof-of-work): every change is checked against floor/schema.json and the
# public rules in test/floor.test.ts before it lands. Public repo, so the minutes are free.
on:
  pull_request:
    paths:
      - "floor/**"
      - "test/floor.test.ts"
      - ".github/workflows/floor.yml"
  push:
    branches: [main]
    paths:
      - "floor/**"
      - "test/floor.test.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - name: Check the Floor file
        run: node --import tsx test/floor.test.ts
