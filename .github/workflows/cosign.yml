# The public recount. Copy to tickerzhq/tickerz-open as .github/workflows/cosign.yml (public repo: free minutes).
# Secrets in tickerz-open: TICKERZ_COSIGNER_KEY (a new Solana keypair made for this job only; its public address goes in
# ORACLE_COSIGNERS on Vercel and COSIGNERS in src/lib/oracle/signer.ts) and SOLANA_RPC_URL (a Helius or dRPC endpoint).
# The recount code is copied from tickerz (src/lib/oracle/{cosign,recount,report,canonical}.ts and their imports) into
# tickerz-open's oracle/ folder, so anyone can read exactly what co-signs.
name: cosign
on:
  schedule:
    - cron: "40 16 * * *"
  workflow_dispatch:
permissions:
  contents: read
# One run at a time: two runs started together both commit and the second push is refused (Oct 9).
concurrency:
  group: cosign
  cancel-in-progress: false
jobs:
  cosign:
    runs-on: ubuntu-latest
    # The only job, and it commits cosigns/ and disputes/ to main.
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - name: Recount and co-sign
        env:
          TICKERZ_COSIGNER_KEY: ${{ secrets.TICKERZ_COSIGNER_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: npx tsx oracle/scripts/cosign.ts --out .
      - name: Commit co-signatures
        run: |
          git config user.name "tickerz-open cosign"
          git config user.email "desk@tickerz.com"
          git add cosigns disputes
          git diff --cached --quiet && exit 0
          git commit -m "cosign: $(date -u +%F)"
          # Other jobs (prints, forecasts) push to main too: replay this commit on top of theirs, then push.
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 5; done
          exit 1
