# Weekly version updates for the three things this repo depends on: the npm packages (package.json), the Python
# packages of Forecast v1 and its shadow models (models/requirements.in and requirements-shadow.in, which pip-compile
# writes with hashes into the .txt files beside them), and the actions
# in .github/workflows (pinned to commit SHAs; Dependabot moves the SHA and the version comment together).
# Minor and patch bumps come as one pull request per ecosystem; a major bump comes on its own. A release is only
# offered once it is 7 days old, so a bad or hijacked release has time to be pulled first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /models
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
